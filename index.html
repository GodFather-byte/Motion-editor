<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Motion Editor</title>
<meta name="description" content="Editor de motion graphics no navegador: camadas, keyframes, efeitos e exportação de vídeo.">
<meta name="theme-color" content="#0E0F14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Montserrat:wght@400;700;900&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:wght@700;900&family=Unbounded:wght@600;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- APP:START -->
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Motion</span></div>
    <input id="projectName" class="project-name" aria-label="Nome do projeto" spellcheck="false">
    <div class="top-actions">
      <button class="icon-btn" id="btnUndo" title="Desfazer (Ctrl+Z)" aria-label="Desfazer"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="icon-btn" id="btnRedo" title="Refazer (Ctrl+Shift+Z)" aria-label="Refazer"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <button class="icon-btn" id="btnMenu" title="Projeto" aria-label="Menu do projeto"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
      <button class="btn btn-install" id="btnInstall" hidden>Instalar app</button>
      <button class="btn btn-primary" id="btnExport">Exportar</button>
    </div>
    <div class="menu" id="menu" hidden>
      <button data-menu="new">Novo projeto</button>
      <button data-menu="demo">Carregar exemplo</button>
      <button data-menu="open">Abrir projeto (.motion.json)</button>
      <button data-menu="save">Salvar projeto</button>
      <button data-menu="png">Exportar frame atual (PNG)</button>
      <button data-menu="help">Atalhos e ajuda</button>
    </div>
  </header>

  <main class="stage-wrap" id="stageWrap">
    <div class="stage" id="stage">
      <canvas id="canvas"></canvas>
      <canvas id="overlay"></canvas>
    </div>
    <div class="add-bar" role="toolbar" aria-label="Adicionar camada">
      <button class="chip" data-add="text"><b>T</b> Texto</button>
      <button class="chip" data-add="rect"><i class="sw sw-rect"></i> Retângulo</button>
      <button class="chip" data-add="ellipse"><i class="sw sw-ellipse"></i> Círculo</button>
      <button class="chip" data-add="star"><i class="sw sw-star"></i> Estrela</button>
      <button class="chip" data-add="image"><i class="sw sw-image"></i> Imagem</button>
      <input type="file" id="imageInput" accept="image/*" hidden>
      <input type="file" id="projectInput" accept=".json,application/json" hidden>
    </div>
  </main>

  <section class="timeline" id="timeline" aria-label="Linha do tempo">
    <div class="tl-head">
      <button class="icon-btn play" id="btnPlay" aria-label="Reproduzir (Espaço)" title="Reproduzir (Espaço)"><svg viewBox="0 0 24 24" class="i-play"><path d="M7 4.5v15l12.5-7.5z"/></svg><svg viewBox="0 0 24 24" class="i-pause"><path d="M7 4.5h3.5v15H7zM13.5 4.5H17v15h-3.5z"/></svg></button>
      <button class="icon-btn" id="btnStart" aria-label="Voltar ao início" title="Voltar ao início (Home)"><svg viewBox="0 0 24 24"><path d="M6 5v14"/><path d="m18 5-9 7 9 7z"/></svg></button>
      <div class="timecode" id="timecode">00:00.00</div>
      <span class="tl-dur" id="tlDur">/ 05:00.00</span>
      <div class="tl-spacer"></div>
      <label class="tl-zoom" title="Zoom da linha do tempo"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg><input type="range" id="tlZoom" min="40" max="400" value="120" aria-label="Zoom da linha do tempo"></label>
    </div>
    <div class="tl-scroll" id="tlScroll">
      <div class="tl-inner" id="tlInner">
        <div class="tl-ruler" id="tlRuler"><div class="tl-label tl-corner">Camadas</div><div class="tl-ticks" id="tlTicks"></div></div>
        <div class="tl-rows" id="tlRows"></div>
        <div class="playhead" id="playhead"><span></span></div>
      </div>
    </div>
  </section>

  <aside class="panel" id="panel" aria-label="Propriedades"></aside>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<!-- APP:END -->
<script src="app.js"></script>
</body>
</html>
